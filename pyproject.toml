[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-rpc-01"
version = "0.1.0"
description = "FinSolve RAG knowledge assistant with role-based access control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.1.0",
    "transformers>=5.17.0",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
    "PyJWT>=2.14.0",
    "pwdlib[argon2]>=0.3.1",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
